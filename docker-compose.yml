services:
  webtube:
    build: .
    container_name: webtube
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - webtube_data:/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m
    mem_limit: 1g
    cpus: 2.0

volumes:
  webtube_data:
