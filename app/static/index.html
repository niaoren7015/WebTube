<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebTube · 在线视频下载器</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b2e;--line:#283550;--muted:#9caac4;--text:#edf3ff;--accent:#7c9cff;--green:#4adea0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172443 0,#0b1020 55%);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);min-height:100vh}
main{width:min(860px,calc(100% - 28px));margin:8vh auto 48px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#7c9cff,#a78bfa);display:grid;place-items:center;color:#081126;font-weight:900;font-size:22px}.brand h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:14px}.panel{background:#111a2bd9;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 20px 70px #0003}.label{display:block;font-size:13px;color:var(--muted);margin:16px 0 7px}input,select{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #344360;background:#0b1324;color:var(--text);outline:none}input:focus,select:focus{border-color:var(--accent)}.urlrow{display:flex;gap:10px}.urlrow input{flex:1;min-width:0}.btn{border:0;border-radius:12px;padding:13px 18px;background:var(--accent);color:#081126;font-weight:750;cursor:pointer;white-space:nowrap}.btn:disabled{opacity:.5;cursor:wait}.secondary{background:#273653;color:var(--text)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.result{margin-top:22px}.video{display:flex;gap:16px;align-items:flex-start}.thumb{width:180px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#0b1324}.video h2{font-size:18px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.hidden{display:none!important}.status{margin-top:18px;padding:14px;border-radius:12px;background:#0b1324;border:1px solid var(--line)}.bar{height:8px;background:#26324a;border-radius:99px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;width:0;background:var(--green);transition:width .3s}.msg{margin-top:14px;color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.foot{font-size:12px;color:var(--muted);margin:18px 4px}.pill{display:inline-block;border:1px solid var(--line);padding:3px 8px;border-radius:999px;font-size:12px;color:var(--muted)}@media(max-width:600px){main{margin-top:28px}.panel{padding:17px}.urlrow{flex-direction:column}.urlrow .btn{width:100%}.thumb{width:120px}.brand h1{font-size:21px}}
</style>
</head>
<body><main>
<div class="brand"><div class="logo">W</div><div><h1>WebTube</h1><div class="sub">自托管 · 轻量 · 由 yt-dlp 驱动</div></div><span class="pill">MVP</span></div>
<section class="panel">
<h2 style="margin:0 0 4px">下载 YouTube 视频</h2><div class="sub">粘贴一个公开视频链接，解析可用格式后开始下载。</div>
<label class="label" for="token">访问令牌（部署者设置的 APP_SECRET）</label><input id="token" type="password" placeholder="输入部署时配置的访问令牌" autocomplete="off"><label class="label" for="url">YouTube 视频链接</label><div class="urlrow"><input id="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="url"><button id="parse" class="btn">解析视频</button></div>
<div id="video" class="result hidden"><div class="video"><img id="thumb" class="thumb" alt=""><div><h2 id="title"></h2><div id="meta" class="muted"></div><div class="muted" style="margin-top:8px">仅下载你拥有或有权保存的内容。</div></div></div>
<label class="label" for="format">视频格式</label><select id="format"><option value="">最佳可用画质（自动合并）</option></select>
<div class="row" style="margin-top:14px"><button id="download" class="btn">开始下载</button><button id="audio" class="btn secondary">仅下载音频 MP3</button></div></div>
<div id="status" class="status hidden"><div id="statusText">正在处理…</div><div class="bar"><span id="bar"></span></div><div id="details" class="muted" style="margin-top:8px"></div><div id="fileLink" style="margin-top:12px"></div></div>
<div id="message" class="msg" role="status"></div>
</section>
<div class="foot">请遵守当地法律、版权要求及 YouTube 适用条款。公开部署前请启用访问控制；不要把账号 Cookie 上传到公共服务。</div>
</main>
<script>
const $=id=>document.getElementById(id);let currentUrl="",busy=false;
function say(s){$("message").textContent=s||""}
function size(n){if(!n)return "大小未知";const u=["B","KB","MB","GB"];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]}
async function api(path,body){const headers={};const token=$("token").value.trim();if(token)headers["X-App-Token"]=token;if(body)headers["Content-Type"]="application/json";const r=await fetch(path,{method:body?"POST":"GET",headers,body:body?JSON.stringify(body):undefined});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||("HTTP "+r.status));return d}
$("parse").onclick=async()=>{if(busy)return;currentUrl=$("url").value.trim();if(!currentUrl){say("请先粘贴视频链接。");return}busy=true;$("parse").disabled=true;$("video").classList.add("hidden");say("正在解析视频信息…");try{const d=await api("/api/info",{url:currentUrl});$("title").textContent=d.title||"未命名视频";$("meta").textContent=[d.uploader,d.duration?Math.floor(d.duration/60)+" 分 "+d.duration%60+" 秒":""].filter(Boolean).join(" · ");$("thumb").src=d.thumbnail||"";$("format").innerHTML='<option value="">最佳可用画质（自动合并）</option>';for(const f of d.formats||[]){if(!f.has_video)continue;const o=document.createElement("option");o.value=f.format_id;o.dataset.hasAudio=String(f.has_audio);o.textContent=[f.resolution||f.format_note||"未知分辨率",f.ext||"",f.has_audio?"含音频":"自动合并音频",size(f.filesize)].filter(Boolean).join(" · ");$("format").append(o)}$("video").classList.remove("hidden");say("解析成功。");}catch(e){say("解析失败："+e.message)}finally{busy=false;$("parse").disabled=false}};
async function start(audio){if(busy)return;const url=$("url").value.trim();if(!url){say("请先粘贴视频链接。");return}busy=true;$("download").disabled=true;$("audio").disabled=true;$("status").classList.remove("hidden");$("fileLink").innerHTML="";$("bar").style.width="0";say("正在创建下载任务…");try{const d=await api("/api/downloads",{url,format_id:audio?null:$("format").value||null,format_has_audio:!audio&&$("format").selectedOptions[0]?.dataset.hasAudio==="true",audio_only:audio});say("任务已创建。");poll(d.id)}catch(e){say("创建任务失败："+e.message);busy=false;$("download").disabled=false;$("audio").disabled=false}}
async function poll(id){try{const d=await api("/api/downloads/"+id);const p=d.progress??0;$("bar").style.width=p+"%";$("statusText").textContent=({queued:"等待下载资源…",downloading:"正在下载…",processing:"正在合并/处理媒体…",completed:"下载完成",failed:"下载失败"})[d.status]||d.status;$("details").textContent=d.total_bytes?size(d.downloaded_bytes||0)+" / "+size(d.total_bytes):"任务 ID："+id;if(d.status==="completed"){$("fileLink").innerHTML="";const a=document.createElement("button");a.type="button";a.textContent="下载文件（"+size(d.file_size)+"）";a.className="btn";a.style.marginTop="4px";a.onclick=async()=>{a.disabled=true;try{const headers={};const token=$("token").value.trim();if(token)headers["X-App-Token"]=token;const r=await fetch(d.download_url,{headers});if(!r.ok){let e={};try{e=await r.json()}catch{}throw new Error(e.detail||("HTTP "+r.status))}const blob=await r.blob();const u=URL.createObjectURL(blob);const link=document.createElement("a");link.href=u;link.download=d.file_name||"webtube-download";document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){say("文件下载失败："+e.message)}finally{a.disabled=false}};$("fileLink").append(a);say("文件将在服务器上保留有限时间。");busy=false;$("download").disabled=false;$("audio").disabled=false;return}if(d.status==="failed"){say("失败原因："+(d.error||"未知错误"));busy=false;$("download").disabled=false;$("audio").disabled=false;return}setTimeout(()=>poll(id),1500)}catch(e){say("查询进度失败："+e.message);busy=false;$("download").disabled=false;$("audio").disabled=false}}
$("download").onclick=()=>start(false);$("audio").onclick=()=>start(true);
</script></body></html>
